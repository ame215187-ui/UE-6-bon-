const DATA=[{"prompt": "Test données de santé par Jamy La loi autorise la revente ou l’échange des données de santé en dehors du cadre médical", "options": [{"label": "a", "text": "vrai", "correct": false}, {"label": "b", "text": "faux", "correct": true}], "page": 1, "options_x": 90.0}, {"prompt": "Parmi les réponses suivantes, laquelle ou lesquelles sont une donnée de santé", "options": [{"label": "a", "text": "le motif de la consultation", "correct": true}, {"label": "b", "text": "un rdv chez son médecin", "correct": true}, {"label": "c", "text": "les ordonnances", "correct": true}], "page": 1, "options_x": 90.0}, {"prompt": "lettres en MAJUSCULE) CNIL Je peux prendre connaissance des données de santé recueillies me concernant et, au besoin, demander leur suppression", "options": [{"label": "a", "text": "vrai", "correct": true}, {"label": "b", "text": "faux", "correct": false}], "page": 1, "options_x": 90.0}, {"prompt": "I. Qu’entend-t-on par identitovigilance ? 1. Qu’est ce que l’identitovigilance ? Les bonnes pratiques de l’identification concernent les professionnels de santé et administratifs qui exercent :", "options": [{"label": "a", "text": "dans le secteur privé", "correct": true}, {"label": "b", "text": "dans le secteur libéral", "correct": true}, {"label": "c", "text": "dans le secteur public", "correct": true}], "page": 1, "options_x": 90.0}, {"prompt": "Les bonnes pratiques d’identification concernent les professionnels de santé et administratifs qui exercent :", "options": [{"label": "a", "text": "dans le milieu sanitaire uniquement", "correct": false}, {"label": "b", "text": "dans le milieu sanitaire, social, et médico-social", "correct": true}, {"label": "c", "text": "dans le milieu médico-social uniquement", "correct": false}, {"label": "d", "text": "dans le milieu social uniquement", "correct": false}], "page": 2, "options_x": 90.0}, {"prompt": "L’identitovigilance est l’organisation mise en oeuvre pour :", "options": [{"label": "a", "text": "surv santé de l’usager", "correct": true}], "page": 3, "options_x": 90.0}, {"prompt": "Quelles autres informations utiles sont à renseigner pour créer l’identité numérique d’un usager ?", "options": [{"label": "a", "text": "l’adresse postale", "correct": true}, {"label": "b", "text": "le prénom utilisé", "correct": true}, {"label": "c", "text": "le nom utilisé", "correct": true}, {"label": "d", "text": "le numéro de sécurité sociale", "correct": false}], "page": 3, "options_x": 90.0}, {"prompt": "la date de naissance II. Les enjeux de l’identitovigilance 1)L’organisation de l’identitovigilance dans une structure 1. La mise en œuvre des bonnes pratiques d’identification est de la responsabilité :", "options": [{"label": "a", "text": "De chaque professionnel", "correct": true}, {"label": "b", "text": "De chaque structure", "correct": true}], "page": 4, "options_x": 126.0}, {"prompt": "2. Au niveau régional, l’identitovigilance est pilotée par :", "options": [{"label": "a", "text": "Plusieurs instances", "correct": true}, {"label": "b", "text": "Une instance unique", "correct": false}], "page": 4, "options_x": 126.0}, {"prompt": "3. La cellule opérationnelle régionale d’identitovigilance peut participer à l’audit des pratiques des structures et à la gestion des risques dans le domaine de l’identification des usagers avec :", "options": [{"label": "a", "text": "L’Assurance Maladie", "correct": false}, {"label": "b", "text": "L’Agence du Numérique en Santé", "correct": false}, {"label": "c", "text": "Les GRADeS", "correct": false}, {"label": "d", "text": "L’Agence Régionale de Santé", "correct": true}], "page": 4, "options_x": 126.0}, {"prompt": "4. Dans tous les secteurs de la santé, la distribution des médicaments au mauvais patient est le risque :", "options": [{"label": "a", "text": "Le plus fréquent", "correct": true}, {"label": "b", "text": "Le moins fréquent", "correct": false}], "page": 4, "options_x": 126.0}, {"prompt": "d’identité 5. Gestion des risques : L'identito ilisé”", "correct": true}], "page": 5, "options_x": 126.0}, {"prompt": "3. Pour communiquer avec l’usager, quel prénom est à utiliser ?", "options": [{"label": "a", "text": "le prénom inscrit sur la carte d’identité", "correct": false}, {"label": "b", "text": "le “prénom utilisé”", "correct": true}], "page": 5, "options_x": 126.0}, {"prompt": "4. Pour s’assurer que l’usager pris en charge est le bon, il vaut mieux lui poser des questions :", "options": [{"label": "a", "text": "ouvertes", "correct": true}, {"label": "b", "text": "fermées", "correct": false}], "page": 6, "options_x": 126.0}, {"prompt": "à une erreur d’identification secondaire, généralement par un mauvais choix de dossier avant d’enregistrer des données ou de classer un document 2. L’utilisation frauduleuse de l’identité d’un usager enregistré dans la structure par un autre usager peut entraîner une collision de données", "options": [{"label": "a", "text": "Faux", "correct": false}, {"label": "b", "text": "vrai", "correct": false}], "page": 6, "options_x": 126.0}, {"prompt": "3. Quelles peuvent être les conséquences d’une collision de données pour un usager ?", "options": [{"label": "a", "text": "la réalisation d’actes invasifs inutiles", "correct": false}, {"label": "b", "text": "la prescription d’un médicament auquel il est allergique", "correct": false}, {"label": "c", "text": "toutes ces réponses, et d’autres conséquences encore", "correct": true}, {"label": "d", "text": "une perte de temps préjudiciable pour la mise en place d’un traitement adapté", "correct": false}], "page": 6, "options_x": 126.0}, {"prompt": "4. Dans quelle situation le terme de “collision de données” est-il rencontré ?", "options": [{"label": "a", "text": "lorsqu’un dossier avec une erreur de saisie d’un trait est créé", "correct": false}, {"label": "b", "text": "lorsqu’un doublon est créé", "correct": false}, {"label": "c", "text": "lorsque les données de 2 usagers sont enregistrées dans un même dossier informatique ou physique", "correct": false}], "page": 6, "options_x": 126.0}, {"prompt": "Vrai 1. Si l’usager présente une Carte Nationale d’Identité et que l’identité numérique enregistrée est complète et concordante, avec matricule INS, le statut obtenu est alors :", "options": [{"label": "a", "text": "identité récupérée", "correct": false}, {"label": "b", "text": "identitée qualifiée", "correct": true}, {"label": "c", "text": "identité validée", "correct": false}], "page": 6, "options_x": 126.0}, {"prompt": "2. Parmi les documents suivants, lesquels sont considérés comme à haut niveau de confiance ?", "options": [{"label": "a", "text": "carte d’identité", "correct": true}, {"label": "b", "text": "Identité numérique La Poste", "correct": true}, {"label": "c", "text": "Permis de conduire", "correct": false}, {"label": "d", "text": "Carte vitale", "correct": false}, {"label": "e", "text": "Passeport", "correct": false}, {"label": "f", "text": "titre de séjour", "correct": false}], "page": 6, "options_x": 126.0}, {"prompt": "3. Classez les différents statuts de l’identité du moins élevé au plus élevé: identité provisoire → identité récupérée → identité validée → identité qualifiée 4. Si un usager non connu de la structure se présente sans document d’identité, alors le statut de son identité numérique est :", "options": [{"label": "a", "text": "identité récupérée", "correct": false}, {"label": "b", "text": "identité provisoire", "correct": true}, {"label": "c", "text": "identité validée", "correct": false}, {"label": "d", "text": "identité qualifiée", "correct": false}], "page": 7, "options_x": 126.0}, {"prompt": "? 1)Un exemple de cas d’usage 1. Grâce à l’INS, l’usager a accès aux comptes rendu de ses professionnels de santé via le service Mon Espace Santé", "options": [{"label": "a", "text": "Vrai", "correct": true}, {"label": "b", "text": "Faux", "correct": false}], "page": 7, "options_x": 126.0}, {"prompt": "2. L’INS permet au professionnel de santé :", "options": [{"label": "a", "text": "de faire une consultation plus rapide", "correct": false}, {"label": "b", "text": "d’éviter la confusion entre 2 patients du même nom", "correct": true}], "page": 7, "options_x": 126.0}, {"prompt": "3. Que doit présenter l’usager pour vérifier la concordance de l’INS avec son identité ?", "options": [{"label": "a", "text": "une pièce d’identité à haut niveau de confiance", "correct": false}, {"label": "b", "text": "sa carte vitale", "correct": false}], "page": 7, "options_x": 126.0}, {"prompt": "4. Une pièce d’identité ou un passeport périmés sont considérés comme pièces d’identité à haut niveau de confiance ?", "options": [{"label": "a", "text": "Vrai", "correct": true}, {"label": "b", "text": "Faux", "correct": false}], "page": 7, "options_x": 126.0}, {"prompt": "5. L’INS se retrouve sur l’ordonnance remise à l’usager, en “clair” et sous forme d’un code datamatrix", "options": [{"label": "a", "text": "Vrai", "correct": true}, {"label": "b", "text": "Faux", "correct": false}], "page": 7, "options_x": 126.0}, {"prompt": "6. Sélectionnez les pièces d’identité à haut niveau de confiance", "options": [{"label": "a", "text": "passeport", "correct": true}, {"label": "b", "text": "titre de séjour pour les étrangers", "correct": true}, {"label": "c", "text": "carte vitale", "correct": false}, {"label": "d", "text": "carte de mutuelle", "correct": false}, {"label": "e", "text": "carte d’identité", "correct": true}, {"label": "f", "text": "permis de conduire", "correct": false}], "page": 8, "options_x": 126.0}, {"prompt": "2)Connaître la composition de l’INS 1. Le matricule INS est identique au numéro de sécurité sociale", "options": [{"label": "a", "text": "les 2 numéros présentent des différences systématiques", "correct": false}, {"label": "b", "text": "les 2 numéros peuvent être identiques", "correct": true}, {"label": "c", "text": "les 2 numéros sont toujours identiques", "correct": false}], "page": 8, "options_x": 126.0}, {"prompt": "2. Les données de santé des p s').innerHTML='';$('meta').textContent='';$('counter').textContent='0 question';return;}if(index>=pool.length)index=0;const q=pool[index];$('counter').textContent=`Question ${index+1} / ${pool.length}`;$('meta').textContent=`Page ${q.page} · ${q.options.length} propositions`;$('prompt').textContent=q.prompt;$('options').innerHTML='';q.options.forEach(o=>{let lab=document.createElement('label');lab.className='opt';lab.innerHTML=`<input type="checkbox" value="${o.label}"><span><b>${o.label.toUpperCase()}.</b> ${escapeHTML(o.text)}</span>`;let input=lab.querySelector('input');input.checked=selected.has(o.label);input.disabled=checked;input.addEventListener('change',()=>{input.checked?selected.add(o.label):selected.delete(o.label)});if(checked){if(o.correct)lab.classList.add('correct');else if(selected.has(o.label))lab.classList.add('wrong')}$('options').appendChild(lab)});$('feedback').textContent=checked?`Réponse(s) correcte(s) en vert. ${q.options.some(o=>o.correct)?'':'Aucune réponse verte n’était indiquée dans le document pour cette question.'}`:'';$('check').disabled=checked;$('check').classList.toggle('hide',checked)}function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function next(){index=(index+1)%pool.length;checked=false;selected=new Set();render()}$('check').onclick=()=>{checked=true;render()};$('next').onclick=next;$('shuffle').onclick=()=>{pool.sort(()=>Math.random()-.5);index=0;checked=false;selected=new Set();render()};$('reset').onclick=()=>{pool=DATA.slice();index=0;checked=false;selected=new Set();$('search').value='';render()};$('search').addEventListener('input',()=>{let term=$('search').value.toLowerCase();pool=DATA.filter(q=>(q.prompt+' '+q.options.map(o=>o.text).join(' ')).toLowerCase().includes(term));index=0;checked=false;selected=new Set();render()});render();</script></body></html>
